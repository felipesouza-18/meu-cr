/* Layout: painel estilo fintech — fundo cinza-claro, barra lateral branca (desktop), tela principal branca e arredondada;
   cartão-destaque preto, cartões pastel (menta, pêssego, lavanda, água) e botões em pílula preta. Celular: cabeçalho + barra de abas. */
:root{
  --bg:#eceef2; --canvas:#ffffff; --surface:#ffffff; --surface-2:#f5f6f8; --fill:#eef0f4; --fill-2:#f5f6f8;
  --ink:#14151c; --ink-2:#3d404c; --muted:#8b909c; --faint:#c4c8d0; --line:#ececf1; --line-2:#dfe2e8;
  --accent:#14151c; --accent-hover:#2a2c36; --accent-ink:#ffffff; --accent-soft:#f1f2f5; --accent-2:#5b74d6;
  --hero:#16171f; --hero-ink:#ffffff; --hero-muted:#9a9eab; --hero-line:rgba(255,255,255,.12);
  --spark:#3ccf9e;
  --mint:#e6f6ec; --mint-ink:#1f8a57; --peach:#fcebe0; --peach-ink:#d9733f; --lav:#e7ecfb; --lav-ink:#5269cf; --teal:#ddefee; --teal-ink:#2c847f;
  --gold:#e0814f; --gold-soft:#fcebe0;
  --good:#1f9d61; --warn:#cf7a1f; --bad:#e5484d; --good-soft:#e6f6ec; --warn-soft:#fdf1e2; --bad-soft:#fdeceb;
  --paper:var(--surface); --soft:var(--surface-2);
  --shadow:0 1px 2px rgba(20,21,28,.03);
  --f-sans:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --nav-h:70px; --r:22px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090c; --canvas:#101116; --surface:#16181f; --surface-2:#1d2029; --fill:#232631; --fill-2:#1d2029;
  --ink:#f3f4f7; --ink-2:#c9ccd5; --muted:#8a8f9d; --faint:#4a4e5a; --line:#23262f; --line-2:#2f333e;
  --accent:#f3f4f7; --accent-hover:#ffffff; --accent-ink:#101116; --accent-soft:#232631; --accent-2:#8fa3f5;
  --hero:#1b1d26; --hero-ink:#ffffff; --hero-muted:#8f94a3; --hero-line:rgba(255,255,255,.1);
  --spark:#45d6a6;
  --mint:#13281e; --mint-ink:#5fd49a; --peach:#2c1d15; --peach-ink:#f09a6c; --lav:#1a2036; --lav-ink:#93a6f5; --teal:#132828; --teal-ink:#5cc6bf;
  --gold:#f09a6c; --gold-soft:#2c1d15;
  --good:#4cc98a; --warn:#eba04b; --bad:#f2676a; --good-soft:#13281e; --warn-soft:#2e2312; --bad-soft:#321a1c;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090c; --canvas:#101116; --surface:#16181f; --surface-2:#1d2029; --fill:#232631; --fill-2:#1d2029;
  --ink:#f3f4f7; --ink-2:#c9ccd5; --muted:#8a8f9d; --faint:#4a4e5a; --line:#23262f; --line-2:#2f333e;
  --accent:#f3f4f7; --accent-hover:#ffffff; --accent-ink:#101116; --accent-soft:#232631; --accent-2:#8fa3f5;
  --hero:#1b1d26; --hero-ink:#ffffff; --hero-muted:#8f94a3; --hero-line:rgba(255,255,255,.1);
  --spark:#45d6a6;
  --mint:#13281e; --mint-ink:#5fd49a; --peach:#2c1d15; --peach-ink:#f09a6c; --lav:#1a2036; --lav-ink:#93a6f5; --teal:#132828; --teal-ink:#5cc6bf;
  --gold:#f09a6c; --gold-soft:#2c1d15;
  --good:#4cc98a; --warn:#eba04b; --bad:#f2676a; --good-soft:#13281e; --warn-soft:#2e2312; --bad-soft:#321a1c;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}

/* ===== moldura ===== */
.shell{max-width:1440px;margin:0 auto;display:block}
.side{display:contents}
.side-brand,.side-prof,.side-foot,.side-sep{display:none}
.app{background:var(--canvas);border-radius:26px;padding:18px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
#view{display:flex;flex-direction:column;gap:22px;min-width:0}

/* cabeçalho (celular) */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;flex:none;display:block;border-radius:10px}
.brand-t{display:flex;flex-direction:column;min-width:0}
h1{font-weight:800;font-size:19px;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand-s{display:none}
.top-r{display:flex;align-items:center;gap:8px}
.sync{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap;padding:0 13px;height:38px;border-radius:99px;background:var(--surface-2);cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.cloud .dot{background:var(--good)}.sync.local .dot{background:var(--gold)}.sync.saving .dot{background:var(--accent-2)}
.theme-btn{width:38px;height:38px;padding:0;border-radius:50%;background:var(--surface-2);border:none;color:var(--ink-2)}
.theme-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* barra de abas (celular) */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--hero);border-radius:24px;
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px;box-shadow:0 14px 30px -12px rgba(10,11,16,.55)}
nav.tabs button{border:none;background:none;height:auto;border-radius:17px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--hero-muted);font-size:10.5px;font-weight:600}
nav.tabs button:hover{background:none;color:#fff}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{background:#fff;color:#14151c}
:root[data-theme="dark"] nav.tabs{border:1px solid var(--line-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs{border:1px solid var(--line-2)}}

/* ===== desktop: barra lateral ===== */
@media (min-width:1024px){
  body{padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);background:var(--surface-2);border-radius:30px;min-height:calc(100vh - 32px);overflow:hidden}
  .side{display:flex;flex-direction:column;gap:22px;padding:30px 22px 26px 30px;position:sticky;top:0;height:calc(100vh - 32px);overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .side-brand .mark{width:34px;height:34px}
  .side-prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 0 18px;border-bottom:1px solid var(--line-2)}
  .avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;background:linear-gradient(135deg,#f0a07a,#e0814f);box-shadow:0 0 0 4px var(--surface-2),0 0 0 5px var(--line-2)}
  .side-prof b{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:6px;line-height:1.25;overflow-wrap:anywhere}
  .side-prof span{font-size:12px;color:var(--muted);line-height:1.35}
  nav.tabs{position:static;display:flex;flex-direction:column;gap:2px;background:none;box-shadow:none;border:none!important;padding:0;border-radius:0}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;font-weight:500;color:var(--muted);padding:11px 14px;border-radius:14px}
  nav.tabs button:hover{color:var(--ink);background:var(--fill)}
  nav.tabs button svg{width:19px;height:19px}
  nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .side-foot{display:flex;flex-direction:column;gap:4px;margin-top:auto;padding-top:18px;border-top:1px solid var(--line-2)}
  .side-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-radius:12px;font-size:14.5px;color:var(--muted);font-weight:500}
  .side-row:hover{background:var(--fill);color:var(--ink)}
  button.side-row{border:none;background:none;height:auto;justify-content:flex-start;gap:10px;width:100%}
  button.side-row svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .app{border-radius:30px;margin:12px 12px 12px 0;padding:30px 34px 34px;box-shadow:0 1px 3px rgba(20,21,28,.04)}
  .top{display:none}
  .page-h h2{font-size:30px}
}

/* ===== tipografia ===== */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch;font-weight:500}
h2{font-weight:800;font-size:18px;margin:0;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
h3{font-weight:700;font-size:15.5px;margin:0;letter-spacing:-.01em;line-height:1.3}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0;max-width:68ch;line-height:1.5;font-weight:500}
.note b{color:var(--ink);font-weight:700}
.cod{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}.a{color:var(--accent-2)}

/* ===== cartões ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ch .sub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:500}
.divider{height:1px;background:var(--line);margin:2px 0}

/* ===== controles ===== */
input,button,select{font:inherit;color:inherit}
input[type=text],input[type=password],select{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 13px;width:100%;min-width:0;font-size:16px;height:44px;font-weight:600;transition:border-color .15s,box-shadow .15s}
input[type=text]:hover,input[type=password]:hover,select:hover{border-color:var(--faint)}
input[type=text]:focus,input[type=password]:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
input.n{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:0 18px;height:42px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s,color .15s,transform .1s}
button:hover{border-color:var(--ink)}
button:active{transform:scale(.98)}
button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.ghost{border-color:transparent;background:none;color:var(--ink-2);padding:0 10px}
button.ghost:hover{background:var(--fill);border-color:transparent}
button.danger{color:var(--bad)}button.danger:hover{border-color:var(--bad);background:var(--bad-soft)}
button.ghost.danger{background:none}button.ghost.danger:hover{background:var(--bad-soft)}
button.x{width:40px;padding:0;color:var(--ink);flex:none;font-size:18px}
button.icon{width:36px;height:36px;padding:0;border-color:transparent;background:none;color:var(--muted);border-radius:50%}
button.icon:hover{color:var(--bad);background:var(--bad-soft)}
a.btnlink{display:inline-flex;align-items:center;height:42px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 18px;font-weight:700;font-size:14px;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.pill,.status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;line-height:1.3}
.pill{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.g,.status.g{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.pill.w,.status.w{background:var(--peach);color:var(--peach-ink);border-color:transparent}
.pill.b,.status.b{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.status{background:var(--surface-2);color:var(--muted)}
.selpill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--ink);background:var(--surface)}

/* ===== Resumo ===== */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1180px){.dash{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.dash-main,.dash-side{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 18px;align-items:end;position:relative;overflow:hidden}
.hero h3{font-size:17px;font-weight:700;color:#fff}
.hero .big{font-size:clamp(40px,9vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:18px}
.hero .meta{font-size:12.5px;color:var(--hero-muted);margin-top:8px;font-weight:500}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:16px;align-self:stretch}
.hero-sp{display:flex;align-items:flex-end;gap:8px}
.hero-sp .chg{font-size:12px;font-weight:700;color:var(--spark);white-space:nowrap}
.hero-sp .chg.down{color:#ff8a80}
.hero-sp svg{width:130px;height:52px;display:block}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero-btns button{height:40px;font-size:13.5px;padding:0 16px}
.hero-btns .w{background:#fff;color:#14151c;border-color:#fff}
.hero-btns .w:hover{background:#f1f2f5}
.hero-btns .o{background:none;color:#fff;border-color:rgba(255,255,255,.55)}
.hero-btns .o:hover{border-color:#fff;background:rgba(255,255,255,.08)}
@media (max-width:600px){.hero{grid-template-columns:1fr;padding:20px}.hero-btns button{white-space:nowrap;padding:0 12px;font-size:13px}.hero-sp .chg{display:none}.hero-r{align-items:stretch}.hero-sp{position:absolute;top:20px;right:20px}.hero-sp svg{width:96px;height:40px}.hero-btns{justify-content:stretch}.hero-btns button{flex:1}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-8px}
.sec-h h2{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.stats{grid-template-columns:1fr}}
.stat{border-radius:20px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat.mint{background:var(--mint)}.stat.peach{background:var(--peach)}.stat.lav{background:var(--lav)}
.stat .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;gap:8px}

.stat .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

.stat .v small{font-size:11.5px;font-weight:800;white-space:nowrap}
@media (max-width:760px){.stat{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center}.stat .lbl{grid-column:1}.stat svg{grid-row:1 / span 2;grid-column:2;margin:0}.stat .v{grid-column:1;justify-content:flex-start}}
.chart-card .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--f-sans);font-size:11.5px;fill:var(--muted);font-weight:600}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.chipsrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.pchip{flex:none;min-width:104px;border-radius:14px;background:var(--surface-2);padding:10px 14px;display:flex;flex-direction:column;gap:2px}

.tx{display:flex;flex-direction:column}
.tx-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx-row:first-child{border-top:none}
.tx-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:var(--mint-ink)}
.tx-ic.w{background:var(--peach);color:var(--peach-ink)}.tx-ic.b{background:var(--bad-soft);color:var(--bad)}.tx-ic.l{background:var(--lav);color:var(--lav-ink)}
.tx-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx-row b{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tx-v{text-align:right;font-size:15px;font-weight:800}
.tx-v small{display:block;font-weight:600}
.mcards{display:flex;flex-direction:column;gap:14px}
.mcard{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;background:var(--teal)}

.mcard-top span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink)}

.mcard-bot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2);font-weight:500}
.mcard-bot b{display:block;font-size:14px;color:var(--ink);font-weight:700;margin-top:2px}

/* meta */
.need{border-radius:16px;padding:13px 15px;background:var(--surface-2);font-size:14.5px;color:var(--ink);line-height:1.5}
.need .num{font-weight:800}
.meter{position:relative;height:8px;border-radius:99px;background:var(--fill)}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--ink)}
.meter .tick{position:absolute;top:-5px;bottom:-5px;width:4px;border-radius:2px;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:7px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:3px}
.stepper button.x{height:34px;width:34px;border:none;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}

.stepper input:focus{box-shadow:none}
.alert{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:16px;font-size:14px;background:var(--surface-2)}

.alert.bad{background:var(--bad-soft)}.alert.warn{background:var(--warn-soft)}.alert.info{background:var(--lav)}
.alert.info .ic{color:var(--lav-ink)}
.alert strong{font-weight:700}

/* ===== disciplinas ===== */
.list{display:flex;flex-direction:column;gap:10px}
.disc{border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}

.disc.tranc .status{background:var(--surface-2);color:var(--muted)}
.d-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.d-name{min-width:0;display:flex;flex-direction:column;gap:2px}
.d-name input{border-color:transparent;background:none;padding:2px 0;height:auto;font-weight:700;font-size:15.5px;border-radius:8px}
.d-name input:hover{border-color:transparent;background:var(--surface-2)}
.d-name input:focus{padding:2px 6px;background:var(--surface);box-shadow:none;border-color:var(--line-2)}
.d-fields{display:flex;gap:8px;align-items:flex-end}
.mini{display:flex;flex-direction:column;gap:3px}
.mini span{font-size:11px;font-weight:700;color:var(--muted)}
.mini input{width:62px;height:38px;padding:6px 10px}

.d-slider{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

input[type=range]{flex:1;min-width:140px;accent-color:var(--ink);height:26px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}

.sw input:checked{background:var(--ink)}
:root[data-theme="dark"] .sw input:checked::after{background:#101116}
.sw input:checked::after{transform:translateX(15px)}
@media (max-width:480px){.d-main{grid-template-columns:1fr}.d-fields{justify-content:flex-start}}

/* histórico e projeção */
.prow{display:grid;grid-template-columns:minmax(0,1fr) 80px 72px;gap:10px;align-items:end}
.prow label,.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.prow .acc{font-size:13px;color:var(--muted);text-align:right;padding-bottom:10px}
details.per{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}

.perbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}

.sim-box{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--surface-2)}

/* tabelas */
table{border-collapse:collapse;width:100%;font-size:14px}

tr:last-child td{border-bottom:none}

th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td.r,th.r{text-align:right}
td .num{font-weight:800}
.tw{overflow-x:auto}

/* diversos */
textarea{width:100%;min-height:96px;font-family:var(--f-sans);font-size:12.5px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px));background:var(--hero);color:#fff;padding:12px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 12px 30px -12px rgba(0,0,0,.45);text-align:center}

.confirm.neutral{background:var(--surface-2)}
.confirm span{flex:1 1 220px}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:480px){.setup-grid{grid-template-columns:1fr}}
.empty{padding:24px 16px;border:1px dashed var(--line-2);border-radius:18px;color:var(--muted);font-size:14px;text-align:center}
.cwrap{display:flex;flex-direction:column;gap:18px;max-height:min(58vh,560px);overflow:auto;padding:2px 4px 2px 2px}
.cgroup{display:flex;flex-direction:column;gap:8px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.copt{justify-content:space-between;text-align:left;height:auto;min-height:50px;padding:10px 16px;border-radius:16px;font-weight:700;font-size:14px;border-color:var(--line)}

.search{position:relative}

.steps-ind{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}

.welcome{display:flex;flex-direction:column;gap:16px}

.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.feat svg{width:22px;height:22px;flex:none;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:640px){.feats{grid-template-columns:1fr}}

.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:2px}
.seg button{height:34px;border:none;background:none;padding:0 14px;font-size:13px;color:var(--muted)}

function planFor(id,enf){
  const c=courseById(id);if(!c)return null;const k=id+'|'+(enf||'');if(planCache[k])return planCache[k];
  let rows=c.d.slice();const E=c.e.find(x=>x[0]===enf)||c.e[0];if(E)rows=rows.concat(E[1]);
  const N=Math.max(...rows.map(r=>r[0]));const per={};for(let p=1;p<=N;p++)per[p]=[];
  const loose=[];let graded=0;
  rows.forEach(r=>{if(r[1]==='ACP0900')return;graded+=r[3];if(r[0]>0)per[r[0]].push([r[1],r[2],r[3]]);else{let cr=r[3];while(cr>6){loose.push([r[1],r[2],4]);cr-=4}if(cr>0)loose.push([r[1],r[2],cr])}});
  const tot=p=>per[p].reduce((s,d)=>s+d[2],0);
  loose.sort((a,b)=>b[2]-a[2]).forEach(d=>{let best=N;for(let p=N;p>=1;p--)if(tot(p)<tot(best))best=p;per[best].push(d)});
  return planCache[k]={N,per,graded,course:c,enf:E?E[0]:'',loose:loose.length>0};
}

      const {data}=await sb.auth.getSession();

      else{acct.state='signedOut';setSync('local','Salvo neste aparelho');refresh()}
    }catch(e){acct.state='signedOut';setSync('local','Salvo neste aparelho');refresh()}
    return;
  }
  try{
    const noAcct=st=>{acct.state=st;setSync('local','Salvo neste aparelho');refresh()};
    if(!window.claude||!window.claude.use)return noAcct('none');

const redirectTo=()=>location.origin+location.pathname;
async function authAction(kind){
  const email=($('#authEmail')?.value||'').trim(),pass=$('#authPass')?.value||'';
  if(authBusy)return;authBusy=true;authMsg='';
  try{
    if(kind==='in'){if(!email||!pass)throw{message:'invalid format'};const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;authMsg=''}
    else if(kind==='up'){if(!email)throw{message:'invalid format'};if(pass.length<6)throw{message:'at least 6'};
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:redirectTo()}});if(error)throw error;
      if(data&&data.user&&data.user.identities&&data.user.identities.length===0)throw{message:'already registered'};
      authMsg=data&&data.session?'':'ok:Conta criada. Enviamos um link de confirmação para '+email+'. Depois de confirmar, volte e toque em Entrar.'}
    else if(kind==='reset'){if(!email)throw{message:'invalid format'};const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectTo()});if(error)throw error;authMsg='ok:Enviamos um link para '+email+' para você criar uma nova senha.'}
    else if(kind==='newpass'){const np=$('#authNewPass')?.value||'';if(np.length<6)throw{message:'at least 6'};const {error}=await sb.auth.updateUser({password:np});if(error)throw error;recovery=false;authMsg='ok:Senha atualizada.';if(sbUser)setTimeout(()=>sbLogin(sbUser),0)}
    else if(kind==='out'){await sb.auth.signOut();sbLogout();toast('Você saiu da conta. Os dados continuam salvos nela.')}
  }catch(e){authMsg='err:'+authErr(e)}

}

/* ============ cálculos ============ */
function prevEff(p){if(p.disc&&p.disc.length){let s=0,c=0;p.disc.forEach(d=>{s+=num(d.nota)*num(d.cred);c+=num(d.cred)});return{cr:c?s/c:0,cred:c,s}}const c=num(p.cred);return{cr:num(p.cr),cred:c,s:num(p.cr)*c}}
function calc(){
  const r={};let Sp=0,Cp=0;S.prev.forEach(p=>{const e=prevEff(p);Sp+=e.s;Cp+=e.cred});
  let Sa=0,Ca=0,Sf=0,Cf=0,Cl=0,fails=[];
  S.cur.disc.forEach(d=>{if(d.tranc)return;const c=num(d.cred),x=num(d.nota);Sa+=x*c;Ca+=c;if(d.fixa){Sf+=x*c;Cf+=c}else Cl+=c;if(x<5&&c>0)fails.push(d)});
  const fut=S.fut.map(p=>{let s=0,c=0;p.disc.forEach(d=>{s+=num(d.nota)*num(d.cred);c+=num(d.cred)});return{s,c,cr:c?s/c:NaN}});
  Object.assign(r,{Sp,Cp,Sa,Ca,Sf,Cf,Cl,fails,fut});
  r.crFechado=Cp?Sp/Cp:NaN; r.crPer=Ca?Sa/Ca:NaN; r.crFimAtual=(Cp+Ca)?(Sp+Sa)/(Cp+Ca):NaN;
  let s=Sp+Sa,c=Cp+Ca;r.path=fut.map(f=>{s+=f.s;c+=f.c;return c?s/c:NaN});
  r.crFinal=c?s/c:NaN;r.Ctot=c;r.Cfut=fut.reduce((a,f)=>a+f.c,0);
  const open=Cl+r.Cfut;r.maxFinal=c?(Sp+Sf+10*open)/c:NaN;r.minFinal=c?(Sp+Sf)/c:NaN;
  return r;
}

}

function needBkReminder(){if(!S||acct.state==='cloud'||acct.state==='checking')return false;const t=S.lastBackup||0;return Date.now()-t>14*864e5&&Date.now()-(S.createdAt||0)>3*864e5}
function needAvg(M,k,r){ // média necessária em tudo sem nota final até o fim do futuro k (0 = só período atual)
  let C=r.Cp+r.Ca,open=r.Cl;for(let j=0;j<k;j++){C+=r.fut[j].c;open+=r.fut[j].c}
  if(!open)return NaN;return (M*C-r.Sp-r.Sf)/open;
}

function smoothPath(P){if(P.length<2)return'';let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;

function drawChart(){
  const svg=$('#chart');if(!svg)return;const r=calc();const M=num(S.meta);
  const pts=[];let s=0,c=0;
  S.prev.forEach(p=>{const e=prevEff(p);s+=e.s;c+=e.cred;pts.push({l:lab(p.nome,pts.length+1),v:e.cr,a:c?s/c:NaN,k:'past'})});
  if(r.Ca)pts.push({l:lab(S.cur.nome,pts.length+1),v:r.crPer,a:r.crFimAtual,k:'cur'});
  S.fut.forEach((p,i)=>{if(r.fut[i].c)pts.push({l:lab(p.nome,pts.length+1),v:r.fut[i].cr,a:r.path[i],k:'fut'})});
  const W=Math.max(300,Math.round(svg.getBoundingClientRect().width)||640),H=W<520?220:270;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(!pts.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">O gráfico aparece quando houver notas.</text>`;return}
  const vals=pts.flatMap(p=>[p.v,p.a]).filter(isFinite).concat([M]);
  let lo=Math.max(0,Math.floor(Math.min(...vals)-.5)),hi=Math.min(10,Math.ceil(Math.max(...vals)+.5));if(hi-lo<2)lo=Math.max(0,hi-2);
  const L=34,R=14,T=40,B=30,iw=W-L-R,ih=H-T-B;const n=pts.length;
  const x=i=>n===1?L+iw/2:L+i*(iw/(n-1)),y=v=>T+ih-(clamp(v,lo,hi)-lo)/(hi-lo)*ih;
  let g=`<defs><linearGradient id="chA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity=".09"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs>`;
  const step=hi-lo>4?2:1;for(let v=lo;v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  pts.forEach((p,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" style="${p.k==='cur'?'fill:var(--ink);font-weight:800':''}">${p.l}${W>=560?' per.':''}</text>`);
  const fi=pts.findIndex(p=>p.k==='fut');if(fi>0)g+=`<rect x="${(x(fi-1)+x(fi))/2}" y="${T-8}" width="${W-R-(x(fi-1)+x(fi))/2}" height="${ih+8}" fill="var(--surface-2)" rx="10"/><text x="${W-R-8}" y="${T+8}" text-anchor="end">projeção</text>`;
  if(M>=lo&&M<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(M)}" y2="${y(M)}" stroke="var(--teal-ink)" stroke-width="1.4" stroke-dasharray="3 5"/>`;
  const A=pts.map((p,i)=>[x(i),y(p.a)]).filter(q=>isFinite(q[1])),V=pts.map((p,i)=>[x(i),y(p.v)]).filter(q=>isFinite(q[1]));
  if(A.length>1){const d=smoothPath(A);g+=`<path d="${d} L${A[A.length-1][0]},${T+ih} L${A[0][0]},${T+ih} Z" fill="url(#chA)"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>`}
  if(V.length>1)g+=`<path d="${smoothPath(V)}" fill="none" stroke="var(--peach-ink)" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>`;
  const ci=pts.findIndex(p=>p.k==='cur');const ti=ci>=0?ci:pts.length-1;const tp=pts[ti];
  if(isFinite(tp.a)){const tx=x(ti),ty=y(tp.a),bx=clamp(tx,L+38,W-R-38);
    g+=`<line x1="${tx}" x2="${tx}" y1="${ty}" y2="${T+ih}" stroke="var(--line-2)"/><circle cx="${tx}" cy="${ty}" r="5.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.4"/>
    <rect x="${bx-38}" y="${ty-48}" width="76" height="36" rx="12" fill="var(--hero)"/><text x="${bx}" y="${ty-31}" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:13px">${fmt(tp.a)}</text><text x="${bx}" y="${ty-18}" text-anchor="middle" style="fill:#9a9eab;font-size:9.5px">${esc(tp.l)} período</text>`}
  svg.innerHTML=g;
}

  const rows=ds.map(d=>{const c=num(d.cred),x=num(d.nota);const Ca=r.Ca-c,Sa=r.Sa-x*c;const per=Ca?Sa/Ca:NaN;const ac=(r.Cp+Ca)?(r.Sp+Sa)/(r.Cp+Ca):NaN;const dl=ac-r.crFimAtual;

  const tr=rows.map(o=>`<tr><td>${esc(o.d.nome)}<br><span class="cod">nota ${fmt(num(o.d.nota),1)} · ${num(o.d.cred)} créd.</span></td><td class="r"><span class="num">${fmt(o.per)}</span></td><td class="r"><span class="num">${fmt(o.ac)}</span></td><td class="r"><span class="num ${o.dl>=0?'g':'b'}">${o.dl>=0?'+':'−'}${fmt(Math.abs(o.dl))}</span></td></tr>`).join('');
  const tc=S.cur.disc.filter(d=>d.tranc);
  return`<div class="ch"><div><h2>E se eu trancar?</h2><div class="sub">Efeito de trancar cada disciplina, com as notas atuais do simulador.</div></div></div>
    ${tc.length?`<div class="alert info">${IC.info}<div><strong>${tc.map(d=>esc(d.nome)).join(', ')}</strong> ${tc.length>1?'estão trancadas e ficam':'está trancada e fica'} fora do CR deste período.</div></div>`:''}
    <div class="tw"><table><thead><tr><th>Se trancar</th><th class="r">CR do período</th><th class="r">CR acumulado</th><th class="r">Efeito</th></tr></thead><tbody>${tr}</tbody></table></div>
    <p class="note">Trancar retira a disciplina do CR do período, mas ela continua pendente na grade. Para simular, ative <b>Trancar</b> na disciplina. No Histórico, <b>Refazer</b> inclui uma disciplina em um próximo período; o app mantém a nota anterior no histórico e soma a nova, então confira a regra com a sua coordenação.</p>`;
}
function impactHTML(r){
  const all=[];S.prev.forEach(p=>(p.disc||[]).forEach(d=>{if(num(d.cred)>0)all.push({nome:d.nome,per:p.nome,nota:num(d.nota),imp:(num(d.nota)-r.crFechado)*num(d.cred)/r.Cp})}));
  if(all.length<3||!r.Cp)return'';
  all.sort((a,b)=>b.imp-a.imp);
  const row=x=>`<tr><td>${esc(x.nome)}<br><span class="cod">${esc(x.per)}</span></td><td class="r"><span class="num">${fmt(x.nota,1)}</span></td><td class="r"><span class="num ${x.imp>=0?'g':'b'}">${x.imp>=0?'+':'−'}${fmt(Math.abs(x.imp),3)}</span></td></tr>`;
  const up=all.slice(0,3),down=all.slice(-3).reverse().filter(x=>x.imp<0);
  return`<section class="card"><div class="ch"><div><h2>Impacto no CR</h2><div class="sub">Disciplinas que mais elevam ou reduzem seu CR acumulado.</div></div></div>
    <div class="tw"><table><thead><tr><th>Elevam o CR</th><th class="r">Nota</th><th class="r">Efeito</th></tr></thead><tbody>${up.map(row).join('')}</tbody></table></div>
    ${down.length?`<div class="tw"><table><thead><tr><th>Reduzem o CR</th><th class="r">Nota</th><th class="r">Efeito</th></tr></thead><tbody>${down.map(row).join('')}</tbody></table></div>`:''}
    <p class="note">Efeito = (nota − CR acumulado) × créditos ÷ total de créditos cursados.</p>
  </section>`;
}

/* ============ eventos ============ */
function scopeArr(scope){if(scope==='cur')return S.cur.disc;if(scope==='prev')return S.prev;const [k,i]=scope.split(':');if(k==='prev'){const p=S.prev[+i];p.disc=p.disc||[];return p.disc}return S.fut[+i].disc}
$('#view').addEventListener('input',e=>{
  const t=e.target;if(!S)return;
  if(t.id==='metaIn'){S.meta=clamp(num(t.value),0,10);touch();refresh();return}
  if(t.id==='curNome'){S.cur.nome=t.value;touch();return}
  if(t.id==='perfNome'){S.nome=t.value.slice(0,40);touch();sideUpdate();return}
  if(t.id==='chgSearch'){chgQ=t.value;$('#chgList').innerHTML=courseListHTML(chgQ,'pick-chg');return}
  if(t.id==='chgEnf'){return}
  if(t.id==='futAll'){$('#futAllOut').textContent=fmt(num(t.value),1);return}
  const row=t.closest('[data-scope]');const f=t.dataset.f;if(!row||!f)return;
  const arr=scopeArr(row.dataset.scope);const it=arr[+row.dataset.i];if(!it)return;
  if(f==='nome'){it.nome=t.value}
  else if(f==='fixa'){it.fixa=t.checked;row.classList.toggle('fixa',it.fixa)}
  else if(f==='tranc'){it.tranc=t.checked;row.classList.toggle('tranc',it.tranc);const pl=row.querySelector('[data-pill]');if(pl){const v=num(it.nota);pl.className='status '+(it.tranc?'':tone(v));pl.textContent=it.tranc?'Trancada':statusLabel(v)}}
  else if(f==='cred'){it.cred=Math.max(0,num(t.value))}
  else if(f==='cr'){it.cr=clamp(num(t.value),0,10)}
  else if(f==='nota'){const v=Math.round(clamp(num(t.value),0,10)*10)/10;it.nota=v;
    if(t.type==='range')row.querySelector('input[data-f="nota"]:not([type=range])').value=fmt(v,1);else row.querySelector('input[type=range]').value=v;
    const pl=row.querySelector('[data-pill]');if(pl&&!it.tranc){pl.className='status '+tone(v);pl.textContent=statusLabel(v)}}
  touch();refresh();
});
$('#view').addEventListener('change',e=>{const t=e.target;
  if(t.id==='chgEnf'&&chg){chg.enf=t.value;render();return}
  if(t.dataset.actIn==='per-all'){const v=clamp(num(t.value),0,10);S.fut[+t.dataset.pi].disc.forEach(d=>d.nota=v);touch();openPer=+t.dataset.pi;render();reopen()}
  if(t.id==='impFile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$('#impTxt').value=fr.result};fr.readAsText(t.files[0])}
  if(t.matches('input.n[data-f="nota"],#metaIn'))t.value=fmt(num(t.value),t.id==='metaIn'?2:1);
});
let openPer=null;function reopen(){if(openPer==null)return;document.querySelectorAll('details.per').forEach(d=>d.open=+d.dataset.pi===openPer);openPer=null}
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const show=(id,v)=>{const el=$(id);if(el)el.hidden=!v};
  switch(a){
  case'meta-':case'meta+':S.meta=Math.round(clamp(num(S.meta)+(a==='meta+'?.1:-.1),0,10)*100)/100;$('#metaIn').value=fmt(S.meta);touch();refresh();break;
  case'del-disc':{const row=b.closest('[data-scope]');const sc=row.dataset.scope;scopeArr(sc).splice(+row.dataset.i,1);touch();if(sc.includes(':'))openPer=+sc.split(':')[1];render();reopen();break}
  case'add-cur':S.cur.disc.push({id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7,fixa:false});touch();render();break;
  case'add-fut':{const i=+b.dataset.pi;S.fut[i].disc.push({id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7});touch();openPer=i;render();reopen();break}
  case'del-per':S.fut.splice(+b.dataset.pi,1);touch();render();break;
  case'add-per':{const last=S.fut.length?S.fut[S.fut.length-1].nome:S.cur.nome;const m=String(last).match(/\d+/);S.fut.push({id:uid(),nome:(m?+m[0]+1:S.fut.length+2)+'º Período',disc:[{id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7}]});touch();openPer=S.fut.length-1;render();reopen();break}
  case'fut-apply':case'scen':{const v=Math.round(clamp(a==='scen'?num(b.dataset.v):num($('#futAll').value),0,10)*10)/10;
    if(!isFinite(v))break;S.fut.forEach(p=>p.disc.forEach(d=>d.nota=v));touch();render();toast(`Média ${fmt(v,1)} aplicada a todas as disciplinas futuras.`);break}
  case'add-prev':{const m=S.prev.length+1;S.prev.push({id:uid(),nome:m+'º Período',cr:7,cred:24});touch();render();break}
  case'del-prev':S.prev.splice(+b.dataset.i,1);touch();render();break;
  case'detail':{const i=+b.dataset.i,p=S.prev[i];const m=String(p.nome).match(/\d+/);const n=m?+m[0]:i+1;const nota=Math.round(num(p.cr)*10)/10;
    const pl=curPlan();p.disc=(pl&&pl.per[n])?discFrom(pl,n,nota).map(({fixa,...d})=>d):[{id:uid(),cod:'',nome:'Disciplina 1',cred:num(p.cred)||4,nota}];
    touch();openPer=i;render();reopen();toast('Grade carregada com a média do período. Substitua pelas notas oficiais.');break}
  case'undetail':{const i=+b.dataset.i,p=S.prev[i];const e=prevEff(p);p.cr=Math.round(e.cr*100)/100;p.cred=e.cred;delete p.disc;touch();openPer=i;render();reopen();break}
  case'go':tab=b.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(_){}render();window.scrollTo(0,0);break;
  case'auth-in':authAction('in');break;
  case'auth-up':authAction('up');break;
  case'auth-reset':authAction('reset');break;
  case'auth-newpass':authAction('newpass');break;
  case'auth-out':authAction('out');break;
  case'show-login':setupLogin=!setupLogin;render();break;
  case'keep-remote':S=acct.remote;saveLocal();acct.state='cloud';acct.remote=null;sbUser&&(cloudOK=false,sbLogin(sbUser));break;
  case'keep-local':acct.state='cloud';acct.remote=null;cloudOK=true;try{localStorage.setItem(OKEY,sbUser.id)}catch(_){};S.updatedAt=Date.now();pushCloud().then(()=>{if(sbUser){cloudOK=false;sbLogin(sbUser)}});break;
  case'theme':setTheme(b.dataset.v);render();break;
  case'retake':{const row=b.closest('[data-scope]');const [,pi]=row.dataset.scope.split(':');const d=S.prev[+pi].disc[+row.dataset.i];
    const nd={id:uid(),cod:d.cod,nome:d.nome.replace(/ \(refazer\)$/,'')+' (refazer)',cred:num(d.cred),nota:7,fixa:false};
    if(S.fut.length){S.fut[0].disc.unshift(nd);toast(`Incluída em ${S.fut[0].nome}. Veja o efeito em Projeção.`)}else{S.cur.disc.unshift(nd);toast('Incluída no período atual.')}
    touch();refresh();break}
  case'add-prevdisc':{const i=+b.dataset.i;S.prev[i].disc.push({id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7});touch();openPer=i;render();reopen();break}
  case'close-ask':show('#closeBox',true);refresh();break;
  case'close-no':show('#closeBox',false);break;
  case'close-do':closePeriod();break;
  case'reset-ask':show('#resetBox',true);break;
  case'reset-no':show('#resetBox',false);break;
  case'reset-do':S=null;setupCurso=null;setupP=1;try{localStorage.removeItem(LKEY)}catch(_){};if(ref){try{await ref.delete()}catch(_){}}tab='painel';render();break;
  case'setup-go':setupGo();break;
  case'pick-setup':setupCurso=b.dataset.id;setupEnf='';setupP=1;render();window.scrollTo(0,0);break;
  case'pick-again':setupCurso=null;render();break;
  case'chg-open':chg={id:null,enf:''};chgQ='';render();break;
  case'chg-close':chg=null;render();break;
  case'pick-chg':chg={id:b.dataset.id,enf:''};render();break;
  case'chg-apply':applyCourseChange();break;
  case'bk-imp':{const el=$('#impBox');el.hidden=!el.hidden;break}
  case'bk-load':{const txt=$('#impTxt').value.trim();let st=null;try{st=migrate(JSON.parse(txt))}catch(_){}
    if(!st){toast('Backup inválido. Use o arquivo exportado ou o texto copiado pelo Meu CR.');break}
    S=st;touch();tab='painel';render();toast('Backup restaurado com sucesso.');break}
  case'bk-copy':{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);S.lastBackup=Date.now();touch();toast('Backup copiado. No outro aparelho, use Importar backup.')}
    catch(_){const el=$('#impBox');el.hidden=false;$('#impTxt').value=txt;$('#impTxt').select();toast('Selecione e copie o texto exibido.')}break}
  case'bk-down':{const data=JSON.stringify(S,null,1);const name='meu-cr-'+new Date().toISOString().slice(0,10)+'.json';
    let ok=false;try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data});ok=true;S.lastBackup=Date.now();touch();toast('Backup exportado.')}}catch(_){ok=true}
    if(!ok){try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);S.lastBackup=Date.now();touch();toast('Backup exportado.')}catch(_){toast('Não foi possível exportar. Use “Copiar como texto”.')}}
    break}
  }
});
function closePeriod(){
  const r=calc();if(!r.Ca)return;
  S.prev.push({id:uid(),nome:S.cur.nome,cr:Math.round(r.crPer*100)/100,cred:r.Ca,disc:S.cur.disc.filter(d=>!d.tranc).map(d=>({id:uid(),cod:d.cod,nome:d.nome,cred:num(d.cred),nota:num(d.nota)}))});
  const fails=S.cur.disc.filter(d=>!d.tranc&&num(d.nota)<5&&num(d.cred)>0).map(d=>({id:uid(),cod:d.cod,nome:d.nome+' (refazer)',cred:d.cred,nota:7,fixa:false}));
  const tranc=S.cur.disc.filter(d=>d.tranc).map(d=>({id:uid(),cod:d.cod,nome:d.nome,cred:num(d.cred),nota:7,fixa:false}));fails.push(...tranc);
  const next=S.fut.shift();
  S.cur={nome:next?next.nome:(()=>{const m=S.cur.nome.match(/\d+/);return m?(+m[0]+1)+'º Período':'Próximo período'})(),disc:[...fails,...(next?next.disc.map(d=>({...d,fixa:false})):[])]};
  S.periodoAtual=(S.periodoAtual||0)+1;touch();render();toast('Período encerrado e movido para o histórico.'+(fails.length?' '+fails.length+(fails.length>1?' disciplinas foram incluídas':' disciplina foi incluída')+' no novo período.':''));
}
function setupGo(){
  const periodo=+$('#sPer').value;const prevCRs=[];
  for(let p=1;p<periodo;p++)prevCRs.push({cr:$('#sc'+p).value||'7',cred:$('#sk'+p).value});
  const total=setupCurso==='outro'?clamp(Math.round(num($('#sTot').value))||8,periodo,14):0;
  S=buildState({curso:setupCurso,enfase:setupEnf,periodo,prevCRs,meta:clamp(num($('#sMeta').value)||7.5,0,10),total});
  S.nome=($('#sNome')?.value||'').trim().slice(0,40);
  touch();tab='atual';render();toast('Painel criado. Comece pelas notas do período atual.');
}


/* ============ início ============ */
/* ============ assistente (IA) ============ */
const AI_ON=false,AI_LIMIT=20;let aiMsgs=[],aiBusy=false,aiLeft=null;
function aiContext(){
  if(!S)return'';const r=calc();const pl=curPlan();const f1=v=>isFinite(v)?v.toFixed(2):'—';
  const L=[];
  L.push(`Curso: ${pl?pl.course.n+(pl.enf?' ('+pl.enf+')':'')+', currículo '+pl.course.cur+', '+pl.course.tot+' créditos, '+pl.N+' períodos':'outro curso (grade manual)'}`);
  L.push(`Meta de CR: ${f1(num(S.meta))}`);
  L.push(`CR acumulado (períodos concluídos): ${f1(r.crFechado)} em ${r.Cp} créditos`);
  L.push(`Períodos concluídos:`);
  S.prev.forEach(p=>{const e=prevEff(p);L.push(`- ${p.nome}: CR ${f1(e.cr)}, ${e.cred} créditos`+(p.disc&&p.disc.length?' | '+p.disc.map(d=>`${d.nome} ${d.cod||''} nota ${num(d.nota).toFixed(1)} (${num(d.cred)}cr)`).join('; '):''))});
  L.push(`Período atual (${S.cur.nome}): CR simulado ${f1(r.crPer)}, ${r.Ca} créditos; CR acumulado ao fim dele: ${f1(r.crFimAtual)}`);
  S.cur.disc.forEach(d=>L.push(`- ${d.nome} ${d.cod||''}: nota ${num(d.nota).toFixed(1)}${d.fixa?' (nota final oficial)':' (simulada)'}, ${num(d.cred)} créditos${d.tranc?', TRANCADA (fora do CR)':''}`));
  if(S.fut.length){L.push('Próximos períodos (projeção com notas estimadas):');S.fut.forEach((p,i)=>L.push(`- ${p.nome}: ${r.fut[i].c} créditos, média estimada ${f1(r.fut[i].cr)}, CR acumulado ao fim ${f1(r.path[i])}`))}
  L.push(`CR projetado na formatura: ${f1(r.crFinal)} (mínimo possível ${f1(r.minFinal)}, máximo possível ${f1(r.maxFinal)})`);
  const nn=needAvg(num(S.meta),0,r);if(isFinite(nn))L.push(`Média necessária nas disciplinas sem nota final do período atual para fechar o período na meta: ${f1(nn)}`);
  return L.join('\n').slice(0,7000);
}
function aiMd(t){
  const e=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return e.split(/\n{2,}/).map(b=>{const ls=b.split('\n');if(ls.every(l=>/^\s*[-•*]\s+/.test(l)))return'<ul>'+ls.map(l=>'<li>'+l.replace(/^\s*[-•*]\s+/,'')+'</li>').join('')+'</ul>';return'<p>'+ls.join('<br>')+'</p>'}).join('');
}
const AI_SUGS=['Quanto preciso tirar para bater minha meta?','Qual disciplina mais pesa no meu CR?','Vale a pena trancar alguma matéria?','Como fica meu CR se eu tirar 8 em tudo daqui para frente?'];
function aiRender(){
  const log=$('#aiLog');
  if(!sbUser){log.innerHTML=`<div class="ai-welcome"><div class="ai-msg a"><p>Para usar o assistente, entre na sua conta.</p><p>Vá em <b>Ajustes → Conta e sincronização</b> e entre ou crie uma conta com seu e-mail. É gratuito.</p></div><div class="row"><button class="primary" data-ai="login">Ir para Ajustes</button></div></div>`;$('#aiForm').hidden=true;return}
  $('#aiForm').hidden=false;
  let h='';
  if(!aiMsgs.length)h+=`<div class="ai-welcome"><div class="ai-msg a"><p>Olá! Eu conheço o seu painel: notas, créditos, meta e projeções.</p><p>Pergunte o que quiser sobre o seu CR.</p></div><div class="ai-sugs">${AI_SUGS.map(q=>`<button data-ai="sug">${esc(q)}</button>`).join('')}</div></div>`;
  h+=aiMsgs.map(m=>`<div class="ai-msg ${m.role==='user'?'u':'a'}${m.err?' err':''}">${m.role==='user'?'<p>'+esc(m.content).replace(/\n/g,'<br>')+'</p>':aiMd(m.content)}</div>`).join('');
  if(aiBusy)h+=`<div class="ai-msg a"><span class="ai-typing" aria-label="Pensando"><i></i><i></i><i></i></span></div>`;
  if(aiLeft!==null)h+=`<p class="ai-quota">${aiLeft>0?`Você ainda pode fazer ${aiLeft} pergunta${aiLeft>1?'s':''} hoje.`:'Você atingiu o limite de hoje. Volte amanhã.'}</p>`;
  log.innerHTML=h;log.scrollTop=log.scrollHeight;
  $('#aiSend').disabled=aiBusy;
}
function aiOpen(){$('#aiSheet').hidden=false;document.body.style.overflow='hidden';aiRender();if(sbUser)setTimeout(()=>$('#aiIn').focus(),60)}
function aiClose(){$('#aiSheet').hidden=true;document.body.style.overflow=''}
async function aiAsk(q){
  q=String(q||'').trim();if(!q||aiBusy||!sbUser)return;
  aiMsgs.push({role:'user',content:q.slice(0,1500)});aiBusy=true;aiRender();
  let reply='',err=false;
  try{
    const hist=aiMsgs.filter(m=>!m.err).slice(-10).map(m=>({role:m.role,content:m.content}));
    const {data,error}=await sb.functions.invoke('assistente',{body:{mensagens:hist,contexto:aiContext()}});
    if(error)throw error;
    if(data&&data.resposta){reply=data.resposta;if(typeof data.restantes==='number')aiLeft=data.restantes}
    else{err=true;const c=data&&data.erro;
      reply=c==='limite'?'Você atingiu o limite de perguntas de hoje. O assistente volta amanhã.':c==='login'?'Sua sessão expirou. Saia e entre de novo na sua conta em Ajustes.':c==='ocupado'?'O assistente está muito requisitado agora. Tente de novo em alguns minutos.':'Não consegui responder agora. Tente de novo em instantes.';
      if(c==='limite')aiLeft=0}
  }catch(e){err=true;reply=navigator.onLine===false?'Você está sem internet. Conecte-se e tente de novo.':'Não consegui falar com o assistente agora. Tente de novo em instantes.'}
  aiMsgs.push({role:'assistant',content:reply,err});aiBusy=false;aiRender();
}
$('#aiFab').addEventListener('click',aiOpen);
$('#aiSheet').addEventListener('click',e=>{const b=e.target.closest('[data-ai]');if(!b)return;const a=b.dataset.ai;
  if(a==='close')aiClose();else if(a==='sug')aiAsk(b.textContent);else if(a==='login'){aiClose();tab='ajustes';render();window.scrollTo(0,0)}});
$('#aiForm').addEventListener('submit',e=>{e.preventDefault();const t=$('#aiIn');const q=t.value;t.value='';t.style.height='';aiAsk(q)});
$('#aiIn').addEventListener('input',e=>{const t=e.target;t.style.height='';t.style.height=Math.min(140,t.scrollHeight)+'px'});
$('#aiIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#aiForm').requestSubmit()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#aiSheet').hidden)aiClose()});
function sideUpdate(){
  const pf=$('#sideProf');if(pf){pf.hidden=!S;const nm=(S&&S.nome||'').trim()||(acct.name?acct.name.split('@')[0]:'')||'Estudante';const pl=S&&curPlan();
    const ini=nm.split(/[\s._-]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'CR';
    pf.innerHTML=`<div class="avatar">${esc(ini)}</div><b>${esc(nm)}</b><span>${pl?esc(pl.course.n):'PUC-Rio'}</span>`}
  const t=$('#sideTheme');if(t)t.checked=isDark();
  const o=$('#sideOut');if(o)o.hidden=!(SB_ON&&sbUser);
}
function aiSync(){sideUpdate();const f=$('#aiFab');if(f)f.hidden=!(AI_ON&&SB_ON&&S&&tab!=='ajustes')}

/* ============ tema ============ */
const TKEY='meucr.theme';const viewerTheme=document.documentElement.getAttribute('data-theme');
let themePref='auto';try{themePref=localStorage.getItem(TKEY)||'auto'}catch(_){}
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){const el=document.documentElement;
  if(themePref==='auto'){if(viewerTheme)el.setAttribute('data-theme',viewerTheme);else el.removeAttribute('data-theme')}else el.setAttribute('data-theme',themePref);
  const b=$('#themeBtn');if(b)b.innerHTML=isDark()?SUN:MOON;try{sideUpdate()}catch(_){}if(S&&tab==='painel')drawChart()}
function setTheme(v){themePref=v;try{localStorage.setItem(TKEY,v)}catch(_){};applyTheme()}
$('#sync').addEventListener('click',()=>{if(S){tab='ajustes';render();window.scrollTo(0,0)}});
$('#sideTheme').addEventListener('change',e=>{setTheme(e.target.checked?'dark':'light');if(S&&tab==='ajustes')render();sideUpdate()});
$('#sideOut').addEventListener('click',()=>authAction('out'));
$('#themeBtn').addEventListener('click',()=>{setTheme(isDark()?'light':'dark');if(S&&tab==='ajustes')render()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(_){}
applyTheme();
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S&&tab==='painel')drawChart()},150)});
S=loadLocal();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
setSync('local',S?'Salvo neste aparelho':'Novo painel');
render();
initCloud();
})();
</script>
