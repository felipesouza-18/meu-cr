  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090e1d; --surface:#111a2d; --surface-2:#162036; --ink:#e9ecf5; --ink-2:#c3c9db; --muted:#8d96ae; --line:#212b44; --line-2:#2d3958;

*{box-sizing:border-box}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px}

.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud .dot{background:var(--good)}.sync.local .dot{background:var(--warn)}.sync.saving .dot{background:var(--accent)}

/* navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

/* tipografia e utilitários */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px 0}

h2{font-weight:700;font-size:18px;margin:0;letter-spacing:-.006em;line-height:1.2;text-wrap:balance}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}

/* controles */
input,button,select{font:inherit;color:inherit}
input[type=text],input[type=password],select{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0;font-size:16px;height:42px;transition:border-color .15s,box-shadow .15s}

input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;height:40px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--muted);background:var(--surface-2)}

a.btnlink{display:inline-flex;align-items:center;height:40px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-sm);padding:0 16px;font-weight:600;font-size:14px;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.prow{display:grid;grid-template-columns:minmax(0,1fr) 80px 72px;gap:10px;align-items:end}

.search{position:relative}

.steps-ind{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}

.welcome{display:flex;flex-direction:column;gap:14px}

      if(data&&data.session&&data.session.user)await sbLogin(data.session.user);
      else{acct.state='signedOut';setSync('local','Salvo neste aparelho');refresh()}
    }catch(e){acct.state='signedOut';setSync('local','Salvo neste aparelho');refresh()}
    return;
  }
  try{
    const noAcct=st=>{acct.state=st;setSync('local','Salvo neste aparelho');refresh()};
    if(!window.claude||!window.claude.use)return noAcct('none');
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!user)return noAcct('none');
    const id=await user.id();if(!id||!db)return noAcct('none');
    try{acct.name=await user.name()||''}catch(_){}
    if(await user.can('data.write')===false)return noAcct('noWrite');
    ref=db.doc('data/users/'+id+'/estado');
    const r=await pullCloud();cloudOK=true;
    if(r&&r.st&&(!S||r.at>=(S.updatedAt||0))){S=r.st;saveLocal();render()}
    else if(S){await pushCloud()}
    acct.state='cloud';setSync('cloud','Sincronizado');refresh();
  }catch(e){acct.state='noWrite';setSync('local','Salvo neste aparelho');refresh()}
}

function authErr(e){const m=String(e&&e.message||e);
  if(/Invalid login/i.test(m))return'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already been registered/i.test(m))return'Já existe uma conta com este e-mail. Use Entrar.';
  if(/Password should be|at least 6/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit|security purposes/i.test(m))return'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if(/valid email|invalid format/i.test(m))return'Digite um e-mail válido.';
  return'Não foi possível concluir agora. Verifique a conexão e tente de novo.'}
const redirectTo=()=>location.origin+location.pathname;
async function authAction(kind){
  const email=($('#authEmail')?.value||'').trim(),pass=$('#authPass')?.value||'';
  if(authBusy)return;authBusy=true;authMsg='';
  try{
    if(kind==='in'){if(!email||!pass)throw{message:'invalid format'};const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;authMsg=''}
    else if(kind==='up'){if(!email)throw{message:'invalid format'};if(pass.length<6)throw{message:'at least 6'};
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:redirectTo()}});if(error)throw error;
      if(data&&data.user&&data.user.identities&&data.user.identities.length===0)throw{message:'already registered'};
      authMsg=data&&data.session?'':'ok:Conta criada. Enviamos um link de confirmação para '+email+'. Depois de confirmar, volte e toque em Entrar.'}
    else if(kind==='reset'){if(!email)throw{message:'invalid format'};const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectTo()});if(error)throw error;authMsg='ok:Enviamos um link para '+email+' para você criar uma nova senha.'}
    else if(kind==='newpass'){const np=$('#authNewPass')?.value||'';if(np.length<6)throw{message:'at least 6'};const {error}=await sb.auth.updateUser({password:np});if(error)throw error;recovery=false;authMsg='ok:Senha atualizada.';if(sbUser)setTimeout(()=>sbLogin(sbUser),0)}
    else if(kind==='out'){await sb.auth.signOut();sbLogout();toast('Você saiu da conta. Os dados continuam salvos nela.')}
  }catch(e){authMsg='err:'+authErr(e)}
  authBusy=false;render();
}

/* ============ cálculos ============ */
function prevEff(p){if(p.disc&&p.disc.length){let s=0,c=0;p.disc.forEach(d=>{s+=num(d.nota)*num(d.cred);c+=num(d.cred)});return{cr:c?s/c:0,cred:c,s}}const c=num(p.cred);return{cr:num(p.cr),cred:c,s:num(p.cr)*c}}
function calc(){
  const r={};let Sp=0,Cp=0;S.prev.forEach(p=>{const e=prevEff(p);Sp+=e.s;Cp+=e.cred});
  let Sa=0,Ca=0,Sf=0,Cf=0,Cl=0,fails=[];
  S.cur.disc.forEach(d=>{if(d.tranc)return;const c=num(d.cred),x=num(d.nota);Sa+=x*c;Ca+=c;if(d.fixa){Sf+=x*c;Cf+=c}else Cl+=c;if(x<5&&c>0)fails.push(d)});
  const fut=S.fut.map(p=>{let s=0,c=0;p.disc.forEach(d=>{s+=num(d.nota)*num(d.cred);c+=num(d.cred)});return{s,c,cr:c?s/c:NaN}});
  Object.assign(r,{Sp,Cp,Sa,Ca,Sf,Cf,Cl,fails,fut});
  r.crFechado=Cp?Sp/Cp:NaN; r.crPer=Ca?Sa/Ca:NaN; r.crFimAtual=(Cp+Ca)?(Sp+Sa)/(Cp+Ca):NaN;
  let s=Sp+Sa,c=Cp+Ca;r.path=fut.map(f=>{s+=f.s;c+=f.c;return c?s/c:NaN});
  r.crFinal=c?s/c:NaN;r.Ctot=c;r.Cfut=fut.reduce((a,f)=>a+f.c,0);
  const open=Cl+r.Cfut;r.maxFinal=c?(Sp+Sf+10*open)/c:NaN;r.minFinal=c?(Sp+Sf)/c:NaN;
  return r;
}
function contaHTML(){
  const a=acct.state;const who=acct.name?esc(acct.name):'';

    if(a==='conflict')return`<div class="alert warn"><span class="w">${IC.alert}</span><div><strong>Sua conta já tem um painel salvo.</strong> Este aparelho também tem dados diferentes. Escolha qual manter; o outro será substituído.</div></div><div class="row"><button class="primary" data-act="keep-remote">Usar os dados da conta</button><button data-act="keep-local">Usar os dados deste aparelho</button></div>`;
    if(a==='cloud'&&sbUser){const m=authMsg.startsWith('ok:')?`<div class="alert info">${IC.info}<div>${esc(authMsg.slice(3))}</div></div>`:'';return`<div class="alert info">${IC.info}<div><strong>Conectado como ${who}.</strong> Tudo é salvo na sua conta e sincronizado em tempo real entre os aparelhos em que você entrar.</div></div>${m}<div class="row"><button data-act="auth-out">Sair da conta</button></div>`}
    if(a==='checking')return`<p class="note">Verificando a conta…</p>`;
    return`<p class="note">Entre ou crie uma conta com seu e-mail para salvar o painel na nuvem e usar o mesmo progresso no celular e no computador ao mesmo tempo.</p>${authFormHTML()}`;
  }
  if(a==='cloud')return`<div class="alert info">${IC.info}<div><strong>Sincronização ativa${who?' · '+who:''}.</strong> Suas alterações são salvas automaticamente na sua conta e ficam disponíveis em qualquer aparelho conectado a ela.</div></div>`;
  if(a==='checking')return`<p class="note">Verificando a conta…</p>`;
  return`<div class="alert">${IC.lock.replace('<svg','<svg class="ic" fill="none" stroke="currentColor" stroke-width="2"')}<div><strong>Salvo neste aparelho${who?' · '+who:''}.</strong> Seu painel é privado e é salvo automaticamente neste navegador. Para usar em outro aparelho, exporte um backup e importe-o lá.</div></div>${lastBk()}`;
}

function lastBk(){const t=S&&S.lastBackup;return`<p class="note">Último backup exportado: ${t?new Date(t).toLocaleDateString('pt-BR'):'nenhum'}.</p>`}
function needBkReminder(){if(!S||acct.state==='cloud'||acct.state==='checking')return false;const t=S.lastBackup||0;return Date.now()-t>14*864e5&&Date.now()-(S.createdAt||0)>3*864e5}
function needAvg(M,k,r){ // média necessária em tudo sem nota final até o fim do futuro k (0 = só período atual)
  let C=r.Cp+r.Ca,open=r.Cl;for(let j=0;j<k;j++){C+=r.fut[j].c;open+=r.fut[j].c}
  if(!open)return NaN;return (M*C-r.Sp-r.Sf)/open;
}

  metaChip:r=>{const ok=isFinite(r.crFimAtual)&&r.crFimAtual>=num(S.meta);return`<span class="h-chip ${ok?'ok':'no'}">${ok?'Atingida':'Em andamento'}</span>`},

function needNowText(r){

  const v=needAvg(M,0,r);const nf=S.cur.disc.filter(d=>!d.fixa).length;
  const alvo=nf===S.cur.disc.length?'nas disciplinas deste período':`nas ${nf} disciplina${nf>1?'s':''} sem nota final`;
  if(v>10)return`Não é possível atingir <span class="num">${fmt(M)}</span> ainda neste período: mesmo com nota 10 ${alvo}, o CR acumulado chegaria a <span class="num">${fmt((r.Sp+r.Sf+10*r.Cl)/(r.Cp+r.Ca))}</span>. Veja na tabela abaixo o prazo viável.`;

function needTable(r){

function meterHTML(r){

  </section>

function drawChart(){
  const svg=$('#chart');if(!svg)return;const r=calc();const M=num(S.meta);
  const pts=[];let s=0,c=0;
  S.prev.forEach(p=>{const e=prevEff(p);s+=e.s;c+=e.cred;pts.push({l:lab(p.nome,pts.length+1),v:e.cr,a:c?s/c:NaN,k:'past'})});
  if(r.Ca){pts.push({l:lab(S.cur.nome,pts.length+1),v:r.crPer,a:r.crFimAtual,k:'cur'})}
  S.fut.forEach((p,i)=>{if(r.fut[i].c)pts.push({l:lab(p.nome,pts.length+1),v:r.fut[i].cr,a:r.path[i],k:'fut'})});
  if(!pts.length){svg.innerHTML='<text x="280" y="120" text-anchor="middle">O gráfico aparece quando houver notas.</text>';return}
  const vals=pts.flatMap(p=>[p.v,p.a]).filter(isFinite).concat([M]);
  let lo=Math.max(0,Math.floor(Math.min(...vals)-.5)),hi=Math.min(10,Math.ceil(Math.max(...vals)+.4));if(hi-lo<2)lo=Math.max(0,hi-2);
  const W=Math.max(300,Math.round(svg.getBoundingClientRect().width)||560),H=W<500?220:250,L=8,R=30,T=26,B=26,iw=W-L-R,ih=H-T-B,bw=iw/pts.length;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const y=v=>T+ih-(clamp(v,lo,hi)-lo)/(hi-lo)*ih,x=i=>L+bw*i+bw/2;
  let g='';
  for(let v=lo;v<=hi;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===lo?1:.6}"/><text x="${W-R+8}" y="${y(v)+4}">${v}</text>`;
  pts.forEach((p,i)=>{const w=Math.min(22,bw*.42),top=y(p.v),h=Math.max(w,T+ih-top);
    const fill=p.k==='fut'?'var(--fill)':'var(--accent)',op=p.k==='past'?.32:p.k==='cur'?.55:1;
    g+=`<rect x="${x(i)-w/2}" y="${T+ih-h}" width="${w}" height="${h}" rx="${w/2}" fill="${fill}" opacity="${op}"/>`;
    g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" style="${p.k==='cur'?'fill:var(--accent);font-weight:700':''}">${p.l}</text>`;});
  if(M>=lo&&M<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(M)}" y2="${y(M)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${L+2}" y="${y(M)-6}" style="fill:var(--gold);font-weight:700">Meta ${fmt(M)}</text>`;
  const lastPast=pts.map(p=>p.k).lastIndexOf('past');
  const seg=(a,b,dash)=>{const q=pts.slice(a,b+1);if(q.length<2)return'';return`<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="0.1 7" opacity=".9"':''} points="${q.map((p,j)=>x(a+j)+','+y(p.a)).join(' ')}"/>`};
  if(lastPast>=0)g+=seg(0,lastPast,false);
  g+=seg(Math.max(0,lastPast),pts.length-1,true);
  pts.forEach((p,i)=>{if(!isFinite(p.a))return;const end=i===pts.length-1;g+=`<circle cx="${x(i)}" cy="${y(p.a)}" r="${end?6:4.5}" fill="${p.k==='past'||end?'var(--accent)':'var(--surface)'}" stroke="${end?'var(--surface)':'var(--accent)'}" stroke-width="${end?3:2.4}"/>`});
  const e=pts[pts.length-1];g+=`<text x="${clamp(x(pts.length-1),L+20,W-R-20)}" y="${y(e.a)-13}" text-anchor="middle" style="fill:var(--accent);font-weight:700;font-size:14px">${fmt(e.a)}</text>`;
  svg.innerHTML=g;
}

      <div><h3 style="margin-bottom:8px">Android · Chrome</h3><ol class="steps"><li>Abra o link do app no Chrome.</li><li>Toque no menu <b>⋮</b>.</li><li>Escolha <b>Adicionar à tela inicial</b>.</li></ol></div>
    </div>
  </section>
  <section class="card">
    <div class="ch"><div><h2>Privacidade</h2><div class="sub">Cada pessoa tem um painel próprio.</div></div></div>
    <p class="note">Quem recebe o link do app começa com um painel em branco e vê apenas os próprios dados. Nenhuma nota é compartilhada entre usuários.</p>
  </section>
  <section class="card">
    <div class="ch"><div><h2>Metodologia</h2><div class="sub">Como os números são calculados.</div></div></div>
    <dl class="kv"><dt>CR</dt><dd>Σ (nota × créditos) ÷ Σ créditos</dd><dt>Aprovação</dt><dd>Média final a partir de 5,0</dd><dt>Restrição</dt><dd>CR do período abaixo de 6,0 limita a matrícula seguinte a 6 disciplinas</dd></dl>
    <p class="note">${rulesCurso()}</p>
  </section>
  <section class="card">
    <div class="ch"><div><h2>Apagar dados</h2><div class="sub">Remove períodos, notas e metas e reinicia a configuração.</div></div><button class="danger" data-act="reset-ask">Apagar tudo</button></div>
    <div id="resetBox" hidden class="confirm"><span>Esta ação não pode ser desfeita. Recomendamos exportar um backup antes.</span><button class="primary" data-act="reset-do" style="background:var(--bad);border-color:var(--bad)">Apagar definitivamente</button><button data-act="reset-no">Cancelar</button></div>
  </section>
  ${footerHTML()}`;
}

/* ----- Configuração inicial ----- */
let setupP=1,setupCurso=null,setupEnf='',setupQ='',setupLogin=false;
function courseListHTML(q,act){
  const t=deaccent(q.trim());const groups={};
  CURSOS.filter(c=>!t||deaccent(c.n).includes(t)).forEach(c=>{(groups[c.c]=groups[c.c]||[]).push(c)});
  const keys=Object.keys(groups).sort();
  let h=keys.map(g=>`<div class="cgroup"><span class="eyebrow">Centro de ${esc(g)}</span><div class="clist">${groups[g].sort((a,b)=>a.n.localeCompare(b.n,'pt')).map(c=>`<button type="button" class="copt" data-act="${act}" data-id="${c.id}"><span>${esc(c.n)}</span><span class="cod">${c.tot} créd.</span></button>`).join('')}</div></div>`).join('');
  if(!keys.length)h=`<div class="empty">Nenhum curso encontrado para “${esc(q)}”. Selecione “Outro curso” para montar a grade manualmente.</div>`;
  return h+`<button type="button" class="copt other" data-act="${act}" data-id="outro"><span>Outro curso ou grade diferente</span><span class="cod">manual</span></button>`;
}
function impBoxHTML(){return`<div id="impBox" hidden style="display:flex;flex-direction:column;gap:10px">
      <input type="file" id="impFile" accept=".json,application/json,text/plain" aria-label="Arquivo de backup">
      <textarea id="impTxt" placeholder="Ou cole aqui o texto do backup"></textarea>
      <div class="row"><button class="primary" data-act="bk-load">Restaurar backup</button></div></div>`}
function viewSetup(){
  if(!setupCurso)return`<section class="card welcome">
    <div class="steps-ind"><i class="on"></i><i></i><span>Etapa 1 de 2</span></div>
    <h2>Acompanhe e projete seu CR na PUC-Rio</h2>
    <p class="note">Escolha seu curso para começar. O painel é montado com a grade oficial, e todos os dados podem ser editados depois.</p>
    <div class="feats">
      <div class="feat"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 9v10"/></svg><div><b>Grade do seu curso</b>Disciplinas, códigos e créditos por período.</div></div>
      <div class="feat"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><div><b>Simulação e metas</b>Veja a média necessária para chegar ao CR desejado.</div></div>
      <div class="feat"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg><div><b>Salvamento automático</b>Seus dados ficam guardados e são só seus.</div></div>
    </div>
    <div class="search">${IC.search}<input type="text" id="cSearch" placeholder="Buscar curso, por exemplo: direito, engenharia, psicologia" value="${esc(setupQ)}" aria-label="Buscar curso" autocomplete="off"></div>
    <div id="cList" class="cwrap">${courseListHTML(setupQ,'pick-setup')}</div>
    <div class="row">${SB_ON?'<button data-act="show-login">Já tenho conta · Entrar</button>':''}<button class="ghost" data-act="bk-imp">Restaurar a partir de um backup</button></div>
    ${SB_ON&&setupLogin?`<div class="card" style="box-shadow:none">${acct.state==='cloud'&&sbUser?'<p class="note">Conectado. Carregando seu painel…</p>':authFormHTML()}</div>`:''}
    ${impBoxHTML()}
  </section>${footerHTML()}`;
  const plan=setupCurso!=='outro'?planFor(setupCurso,setupEnf):null;const c=plan&&plan.course;
  const total=plan?plan.N:14;setupP=clamp(setupP,1,total);
  let prevRows='';for(let p=1;p<setupP;p++)prevRows+=`<div class="prow">
    <div style="padding-bottom:10px;font-weight:600">${p}º Período</div>
    <div><label for="sc${p}">CR</label><input type="text" inputmode="decimal" class="n" id="sc${p}" placeholder="7,00"></div>
    <div><label for="sk${p}">Créditos</label><input type="text" inputmode="numeric" class="n" id="sk${p}" value="${credOf(plan,p)}"></div></div>`;
  return`<section class="card welcome">
    <div class="steps-ind"><i class="on"></i><i class="on"></i><span>Etapa 2 de 2</span></div>
    <div class="chosen"><div style="min-width:0"><h3>${c?esc(c.n):'Outro curso'}</h3>
      <span class="note">${c?`Currículo ${esc(c.cur)} · ${c.tot} créditos · ${plan.N} períodos`:'Grade montada manualmente'}</span></div>
      <button class="ghost" data-act="pick-again">Alterar</button></div>
    <div class="setup-grid">
      ${c&&c.e.length?`<div class="field"><label for="sEnf">Ênfase ou habilitação</label><select id="sEnf">${c.e.map(e=>`<option ${e[0]===plan.enf?'selected':''}>${esc(e[0])}</option>`).join('')}</select></div>`:''}
      <div class="field"><label for="sPer">Período em curso</label><select id="sPer">${Array.from({length:total},(_,i)=>`<option value="${i+1}" ${i+1===setupP?'selected':''}>${i+1}º período</option>`).join('')}</select></div>
      ${!c?`<div class="field"><label for="sTot">Duração do curso (períodos)</label><input type="text" inputmode="numeric" class="n" id="sTot" value="8"></div>`:''}
      <div class="field"><label for="sMeta">Meta de CR</label><input type="text" inputmode="decimal" class="n" id="sMeta" value="7,50"></div>
    </div>
    ${setupP>1?`<div><h3>Períodos concluídos</h3><p class="note" style="margin-top:2px">Informe o CR de cada período, como aparece no PUC Online. Os créditos já vêm da grade.</p></div><div class="list">${prevRows}</div>`:''}
    <div class="row end"><button class="primary" data-act="setup-go" style="height:46px;padding:0 22px;font-size:15px">Criar meu painel</button></div>
    <p class="note">Depois, em <b>Histórico</b>, você pode detalhar as notas de cada disciplina dos períodos anteriores.</p>
  </section>${footerHTML()}`;
}
function bindSetup(){
  const q=$('#cSearch');if(q)q.oninput=()=>{setupQ=q.value;$('#cList').innerHTML=courseListHTML(setupQ,'pick-setup')};
  const p=$('#sPer');if(p)p.onchange=()=>{setupP=+p.value;render()};
  const e=$('#sEnf');if(e)e.onchange=()=>{setupEnf=e.value;render()};
}

/* ============ eventos ============ */
function scopeArr(scope){if(scope==='cur')return S.cur.disc;if(scope==='prev')return S.prev;const [k,i]=scope.split(':');if(k==='prev'){const p=S.prev[+i];p.disc=p.disc||[];return p.disc}return S.fut[+i].disc}
$('#view').addEventListener('input',e=>{
  const t=e.target;if(!S)return;
  if(t.id==='metaIn'){S.meta=clamp(num(t.value),0,10);touch();refresh();return}
  if(t.id==='curNome'){S.cur.nome=t.value;touch();return}
  if(t.id==='chgSearch'){chgQ=t.value;$('#chgList').innerHTML=courseListHTML(chgQ,'pick-chg');return}
  if(t.id==='chgEnf'){return}
  if(t.id==='futAll'){$('#futAllOut').textContent=fmt(num(t.value),1);return}
  const row=t.closest('[data-scope]');const f=t.dataset.f;if(!row||!f)return;
  const arr=scopeArr(row.dataset.scope);const it=arr[+row.dataset.i];if(!it)return;
  if(f==='nome'){it.nome=t.value}
  else if(f==='fixa'){it.fixa=t.checked;row.classList.toggle('fixa',it.fixa)}
  else if(f==='tranc'){it.tranc=t.checked;row.classList.toggle('tranc',it.tranc);const pl=row.querySelector('[data-pill]');if(pl){const v=num(it.nota);pl.className='status '+(it.tranc?'':tone(v));pl.textContent=it.tranc?'Trancada':statusLabel(v)}}
  else if(f==='cred'){it.cred=Math.max(0,num(t.value))}
  else if(f==='cr'){it.cr=clamp(num(t.value),0,10)}
  else if(f==='nota'){const v=Math.round(clamp(num(t.value),0,10)*10)/10;it.nota=v;
    if(t.type==='range')row.querySelector('input[data-f="nota"]:not([type=range])').value=fmt(v,1);else row.querySelector('input[type=range]').value=v;
    const pl=row.querySelector('[data-pill]');if(pl&&!it.tranc){pl.className='status '+tone(v);pl.textContent=statusLabel(v)}}
  touch();refresh();
});
$('#view').addEventListener('change',e=>{const t=e.target;
  if(t.id==='chgEnf'&&chg){chg.enf=t.value;render();return}
  if(t.dataset.actIn==='per-all'){const v=clamp(num(t.value),0,10);S.fut[+t.dataset.pi].disc.forEach(d=>d.nota=v);touch();openPer=+t.dataset.pi;render();reopen()}
  if(t.id==='impFile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$('#impTxt').value=fr.result};fr.readAsText(t.files[0])}
  if(t.matches('input.n[data-f="nota"],#metaIn'))t.value=fmt(num(t.value),t.id==='metaIn'?2:1);
});
let openPer=null;function reopen(){if(openPer==null)return;document.querySelectorAll('details.per').forEach(d=>d.open=+d.dataset.pi===openPer);openPer=null}
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const show=(id,v)=>{const el=$(id);if(el)el.hidden=!v};
  switch(a){
  case'meta-':case'meta+':S.meta=Math.round(clamp(num(S.meta)+(a==='meta+'?.1:-.1),0,10)*100)/100;$('#metaIn').value=fmt(S.meta);touch();refresh();break;
  case'del-disc':{const row=b.closest('[data-scope]');const sc=row.dataset.scope;scopeArr(sc).splice(+row.dataset.i,1);touch();if(sc.includes(':'))openPer=+sc.split(':')[1];render();reopen();break}
  case'add-cur':S.cur.disc.push({id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7,fixa:false});touch();render();break;
  case'add-fut':{const i=+b.dataset.pi;S.fut[i].disc.push({id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7});touch();openPer=i;render();reopen();break}
  case'del-per':S.fut.splice(+b.dataset.pi,1);touch();render();break;
  case'add-per':{const last=S.fut.length?S.fut[S.fut.length-1].nome:S.cur.nome;const m=String(last).match(/\d+/);S.fut.push({id:uid(),nome:(m?+m[0]+1:S.fut.length+2)+'º Período',disc:[{id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7}]});touch();openPer=S.fut.length-1;render();reopen();break}
  case'fut-apply':case'scen':{const v=Math.round(clamp(a==='scen'?num(b.dataset.v):num($('#futAll').value),0,10)*10)/10;
    if(!isFinite(v))break;S.fut.forEach(p=>p.disc.forEach(d=>d.nota=v));touch();render();toast(`Média ${fmt(v,1)} aplicada a todas as disciplinas futuras.`);break}
  case'add-prev':{const m=S.prev.length+1;S.prev.push({id:uid(),nome:m+'º Período',cr:7,cred:24});touch();render();break}
  case'del-prev':S.prev.splice(+b.dataset.i,1);touch();render();break;
  case'detail':{const i=+b.dataset.i,p=S.prev[i];const m=String(p.nome).match(/\d+/);const n=m?+m[0]:i+1;const nota=Math.round(num(p.cr)*10)/10;
    const pl=curPlan();p.disc=(pl&&pl.per[n])?discFrom(pl,n,nota).map(({fixa,...d})=>d):[{id:uid(),cod:'',nome:'Disciplina 1',cred:num(p.cred)||4,nota}];
    touch();openPer=i;render();reopen();toast('Grade carregada com a média do período. Substitua pelas notas oficiais.');break}
  case'undetail':{const i=+b.dataset.i,p=S.prev[i];const e=prevEff(p);p.cr=Math.round(e.cr*100)/100;p.cred=e.cred;delete p.disc;touch();openPer=i;render();reopen();break}
  case'auth-in':authAction('in');break;
  case'auth-up':authAction('up');break;
  case'auth-reset':authAction('reset');break;
  case'auth-newpass':authAction('newpass');break;
  case'auth-out':authAction('out');break;
  case'show-login':setupLogin=!setupLogin;render();break;
  case'keep-remote':S=acct.remote;saveLocal();acct.state='cloud';acct.remote=null;sbUser&&(cloudOK=false,sbLogin(sbUser));break;
  case'keep-local':acct.state='cloud';acct.remote=null;cloudOK=true;try{localStorage.setItem(OKEY,sbUser.id)}catch(_){};S.updatedAt=Date.now();pushCloud().then(()=>{if(sbUser){cloudOK=false;sbLogin(sbUser)}});break;
  case'theme':setTheme(b.dataset.v);render();break;
  case'retake':{const row=b.closest('[data-scope]');const [,pi]=row.dataset.scope.split(':');const d=S.prev[+pi].disc[+row.dataset.i];
    const nd={id:uid(),cod:d.cod,nome:d.nome.replace(/ \(refazer\)$/,'')+' (refazer)',cred:num(d.cred),nota:7,fixa:false};
    if(S.fut.length){S.fut[0].disc.unshift(nd);toast(`Incluída em ${S.fut[0].nome}. Veja o efeito em Projeção.`)}else{S.cur.disc.unshift(nd);toast('Incluída no período atual.')}
    touch();refresh();break}
  case'add-prevdisc':{const i=+b.dataset.i;S.prev[i].disc.push({id:uid(),cod:'',nome:'Nova disciplina',cred:4,nota:7});touch();openPer=i;render();reopen();break}
  case'close-ask':show('#closeBox',true);refresh();break;
  case'close-no':show('#closeBox',false);break;
  case'close-do':closePeriod();break;
  case'reset-ask':show('#resetBox',true);break;
  case'reset-no':show('#resetBox',false);break;
  case'reset-do':S=null;setupCurso=null;setupP=1;try{localStorage.removeItem(LKEY)}catch(_){};if(ref){try{await ref.delete()}catch(_){}}tab='painel';render();break;
  case'setup-go':setupGo();break;
  case'pick-setup':setupCurso=b.dataset.id;setupEnf='';setupP=1;render();window.scrollTo(0,0);break;
  case'pick-again':setupCurso=null;render();break;
  case'chg-open':chg={id:null,enf:''};chgQ='';render();break;
  case'chg-close':chg=null;render();break;
  case'pick-chg':chg={id:b.dataset.id,enf:''};render();break;
  case'chg-apply':applyCourseChange();break;
  case'bk-imp':{const el=$('#impBox');el.hidden=!el.hidden;break}
  case'bk-load':{const txt=$('#impTxt').value.trim();let st=null;try{st=migrate(JSON.parse(txt))}catch(_){}
    if(!st){toast('Backup inválido. Use o arquivo exportado ou o texto copiado pelo Meu CR.');break}
    S=st;touch();tab='painel';render();toast('Backup restaurado com sucesso.');break}
  case'bk-copy':{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);S.lastBackup=Date.now();touch();toast('Backup copiado. No outro aparelho, use Importar backup.')}
    catch(_){const el=$('#impBox');el.hidden=false;$('#impTxt').value=txt;$('#impTxt').select();toast('Selecione e copie o texto exibido.')}break}
  case'bk-down':{const data=JSON.stringify(S,null,1);const name='meu-cr-'+new Date().toISOString().slice(0,10)+'.json';
    let ok=false;try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data});ok=true;S.lastBackup=Date.now();touch();toast('Backup exportado.')}}catch(_){ok=true}
    if(!ok){try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);S.lastBackup=Date.now();touch();toast('Backup exportado.')}catch(_){toast('Não foi possível exportar. Use “Copiar como texto”.')}}
    break}
  }
});
function closePeriod(){
  const r=calc();if(!r.Ca)return;
  S.prev.push({id:uid(),nome:S.cur.nome,cr:Math.round(r.crPer*100)/100,cred:r.Ca,disc:S.cur.disc.filter(d=>!d.tranc).map(d=>({id:uid(),cod:d.cod,nome:d.nome,cred:num(d.cred),nota:num(d.nota)}))});
  const fails=S.cur.disc.filter(d=>!d.tranc&&num(d.nota)<5&&num(d.cred)>0).map(d=>({id:uid(),cod:d.cod,nome:d.nome+' (refazer)',cred:d.cred,nota:7,fixa:false}));
  const tranc=S.cur.disc.filter(d=>d.tranc).map(d=>({id:uid(),cod:d.cod,nome:d.nome,cred:num(d.cred),nota:7,fixa:false}));fails.push(...tranc);
  const next=S.fut.shift();
  S.cur={nome:next?next.nome:(()=>{const m=S.cur.nome.match(/\d+/);return m?(+m[0]+1)+'º Período':'Próximo período'})(),disc:[...fails,...(next?next.disc.map(d=>({...d,fixa:false})):[])]};
  S.periodoAtual=(S.periodoAtual||0)+1;touch();render();toast('Período encerrado e movido para o histórico.'+(fails.length?' '+fails.length+(fails.length>1?' disciplinas foram incluídas':' disciplina foi incluída')+' no novo período.':''));
}
function setupGo(){
  const periodo=+$('#sPer').value;const prevCRs=[];
  for(let p=1;p<periodo;p++)prevCRs.push({cr:$('#sc'+p).value||'7',cred:$('#sk'+p).value});
  const total=setupCurso==='outro'?clamp(Math.round(num($('#sTot').value))||8,periodo,14):0;
  S=buildState({curso:setupCurso,enfase:setupEnf,periodo,prevCRs,meta:clamp(num($('#sMeta').value)||7.5,0,10),total});
  touch();tab='atual';render();toast('Painel criado. Comece pelas notas do período atual.');
}


/* ============ início ============ */
/* ============ tema ============ */
const TKEY='meucr.theme';const viewerTheme=document.documentElement.getAttribute('data-theme');
let themePref='auto';try{themePref=localStorage.getItem(TKEY)||'auto'}catch(_){}
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){const el=document.documentElement;
  if(themePref==='auto'){if(viewerTheme)el.setAttribute('data-theme',viewerTheme);else el.removeAttribute('data-theme')}else el.setAttribute('data-theme',themePref);
  const b=$('#themeBtn');if(b)b.innerHTML=isDark()?SUN:MOON;if(S&&tab==='painel')drawChart()}
function setTheme(v){themePref=v;try{localStorage.setItem(TKEY,v)}catch(_){};applyTheme()}
$('#sync').addEventListener('click',()=>{if(S){tab='ajustes';render();window.scrollTo(0,0)}});
$('#themeBtn').addEventListener('click',()=>{setTheme(isDark()?'light':'dark');if(S&&tab==='ajustes')render()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(_){}
applyTheme();
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S&&tab==='painel')drawChart()},150)});
S=loadLocal();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
setSync('local',S?'Salvo neste aparelho':'Novo painel');
render();
initCloud();
})();
</script>
